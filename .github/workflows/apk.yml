name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar código do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17 (Correção do Erro)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Capacitor e ferramentas Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp index.html manifest.json sw.js icon.svg www/ 2>/dev/null || true
          npx cap init "WorkTime Pro" "lu.marcio.worktimepro" --web-dir=www
          npx cap add android

      - name: Compilar APK Debug instalável
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: WorkTime-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
