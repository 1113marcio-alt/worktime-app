name: Build Android APK

on:
  push:
    branches: [ main, worktime-pro-2 ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar JavaScript e compatibilidade dos dados antigos
        run: node --test tests/smoke.cjs

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8 @capacitor/filesystem@^8 @capacitor/share@^8
          mkdir -p www
          cp index.html manifest.json sw.js pro-ui.css pro-ui.js country-rules.js wt-i18n.js www/
          # A branch de testes usa um identificador diferente para nunca substituir
          # a aplicação principal ou o seu armazenamento Android.
          if [ "$GITHUB_REF_NAME" = "worktime-pro-2" ]; then
            APP_NAME="WorkTime Pro 2 Preview"
            APP_ID="lu.marcio.worktimepro.preview"
          else
            APP_NAME="WorkTime Pro"
            APP_ID="lu.marcio.worktimepro"
          fi
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          echo "Aplicação Android: $APP_NAME ($APP_ID)"
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'worktime-pro-2' && 'WorkTime-Pro-2-Preview-APK' || 'WorkTime-Pro-Android-APK' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
