name: Build Android APK

on:
  push:
    branches: [ main, worktime-pro-2 ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8
          mkdir -p www
          cp index.html manifest.json sw.js www/
          npx cap init "WorkTime Pro" "lu.marcio.worktimepro" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkTime-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
